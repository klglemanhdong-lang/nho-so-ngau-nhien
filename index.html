<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Memory - Luyện Trí Nhớ Số</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0e15;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            overflow: hidden;
            background-color: #1a1a2e;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        #game-world {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            transform-origin: 0 0;
            will-change: transform;
            transition: filter 0.3s ease;
        }

        #game-world.blurred {
            filter: blur(25px) brightness(0.6);
        }

        #background-layer {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-repeat: repeat-x;
            background-size: auto 100%;
            background-position: left top;
            will-change: transform;
        }

        #stage-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .platform {
            position: absolute;
            background: linear-gradient(180deg, #4a3525 0%, #2a1a0e 100%);
            border-top: 4px solid #8b5a2b;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 10px;
            color: #e6c280;
            font-weight: bold;
            font-size: 24px;
            letter-spacing: 2px;
            z-index: 5;
        }

        .balloon-container {
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
            pointer-events: none;
            z-index: 10;
        }

        .balloon-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .balloon-number {
            position: absolute;
            width: 100%;
            text-align: center;
            font-weight: 900;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            text-shadow: 0 0 6px rgba(0,0,0,0.9), 0 0 12px rgba(0,0,0,0.9), 2px 2px 0 #000;
            letter-spacing: 2px;
            z-index: 12;
        }

        .ninja-container {
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
            pointer-events: none;
            z-index: 20;
        }

        .ninja-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .fallback-ninja {
            width: 100%;
            height: 100%;
            background-color: #e74c3c;
            border: 3px solid #fff;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
        }

        .fallback-balloon {
            width: 100%;
            height: 70%;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            border: 2px solid rgba(255,255,255,0.8);
            position: relative;
        }

        .fallback-string {
            position: absolute;
            bottom: -100px;
            left: 50%;
            width: 3px;
            height: 100px;
            background-color: #ddd;
            transform: translateX(-50%);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Thanh điều khiển âm lượng cố định toàn màn hình */
        #audio-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.85);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            z-index: 300;
            pointer-events: auto;
        }

        .audio-btn {
            background: none;
            border: none;
            color: #f1c40f;
            font-size: 20px;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .audio-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .volume-slider {
            width: 80px;
            accent-color: #f1c40f;
            cursor: pointer;
        }

        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 14, 21, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .game-title {
            font-size: 56px;
            color: #f1c40f;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.5), 3px 3px 0 #000;
        }

        .config-box {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #475569;
            padding: 20px 30px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 380px;
        }

        .config-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #f8fafc;
            font-size: 18px;
            font-weight: 600;
        }

        .config-group select, .config-group input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #64748b;
            background: #0f172a;
            color: #f8fafc;
            font-size: 16px;
            outline: none;
            text-align: center;
            width: 160px;
        }

        .btn-main {
            padding: 14px 40px;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4);
            transition: all 0.2s ease;
        }

        .btn-main:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.6);
        }

        .btn-secondary {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        #ready-control {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            pointer-events: auto;
            z-index: 150;
            text-align: center;
            background: rgba(15, 23, 42, 0.7);
            padding: 30px 50px;
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
        }

        #countdown-timer {
            font-size: 48px;
            font-weight: 900;
            color: #f1c40f;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.6);
            font-family: 'Courier New', Courier, monospace;
        }

        #ready-btn {
            padding: 20px 50px;
            font-size: 26px;
            background: linear-gradient(135deg, #27ae60, #2ea043);
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.6);
            animation: pulse-btn 1.5s infinite alternate;
        }

        @keyframes pulse-btn {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* Nút nhảy thủ công bên phải (Giảm kích thước 50%) */
        #manual-controls {
            position: absolute;
            bottom: 20px;
            right: 25px;
            display: none;
            pointer-events: auto;
            z-index: 150;
        }

        #manual-btn {
            padding: 8px 18px;
            font-size: 13px;
            background: linear-gradient(135deg, #27ae60, #2ea043);
            box-shadow: 0 3px 10px rgba(39, 174, 96, 0.4);
            border-radius: 25px;
        }

        /* Nút Kết thúc bài làm ngay lập tức bên trái (Giảm kích thước 50%) */
        #early-finish-controls {
            position: absolute;
            bottom: 20px;
            left: 25px;
            display: none;
            pointer-events: auto;
            z-index: 150;
        }

        #early-finish-btn {
            padding: 8px 16px;
            font-size: 13px;
            background: linear-gradient(135deg, #e67e22, #d35400);
            box-shadow: 0 3px 10px rgba(230, 126, 34, 0.4);
            border-radius: 25px;
        }

        #recall-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            pointer-events: auto;
            padding: 20px;
            z-index: 200;
            overflow-y: auto;
        }

        .recall-title {
            font-size: 32px;
            color: #f8fafc;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .completion-time-tag {
            font-size: 18px;
            color: #22c55e;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .recall-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 1000px;
            width: 100%;
            margin-bottom: 15px;
            max-height: 50vh;
            overflow-y: auto;
            padding-right: 10px;
        }

        .recall-item {
            background: #1e293b;
            padding: 8px;
            border-radius: 10px;
            border: 2px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .recall-item label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .recall-input {
            width: 100%;
            padding: 6px;
            font-size: 18px;
            text-align: center;
            font-family: monospace;
            font-weight: bold;
            background: #0f172a;
            color: #f8fafc;
            border: 2px solid #475569;
            border-radius: 6px;
            outline: none;
        }

        .recall-item.correct { border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }
        .recall-item.wrong { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }

        .correct-answer-label {
            margin-top: 4px;
            font-size: 12px;
            color: #4ade80;
            font-weight: bold;
            display: none;
        }

        #recall-result {
            font-size: 24px;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 10px;
        }

        /* Modal Lịch sử Luyện tập / Thành tích */
        #history-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.92);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 250;
            padding: 20px;
        }

        .history-box {
            width: 100%;
            max-width: 950px;
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid #475569;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            max-height: 80vh;
        }

        .history-title {
            color: #f1c40f;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .history-table-container {
            overflow-y: auto;
            flex-grow: 1;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            color: #f8fafc;
            font-size: 15px;
            text-align: center;
        }

        .history-table th, .history-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #334155;
        }

        .history-table th {
            background: #0f172a;
            color: #f1c40f;
            position: sticky;
            top: 0;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- BỘ ĐIỀU KHIỂN ÂM LƯỢNG CỐ ĐỊNH TẤT CẢ MÀN HÌNH -->
        <div id="audio-controls">
            <button class="audio-btn" id="mute-btn" title="Tắt/Bật âm thanh">🔊</button>
            <input type="range" class="volume-slider" id="volume-range" min="0" max="1" step="0.05" value="0.5">
        </div>

        <div id="game-world" class="blurred">
            <div id="background-layer"></div>
            <div id="stage-layer"></div>
        </div>

        <div id="ui-layer">
            <div id="start-overlay">
                <h1 class="game-title">NINJA MEMORY</h1>
                
                <div class="config-box">
                    <div class="config-group">
                        <label for="player-name-input">Tên người chơi:</label>
                        <input type="text" id="player-name-input" placeholder="Nhập tên..." maxlength="20">
                    </div>
                    <div class="config-group">
                        <label for="mode-select">Chế độ nhảy:</label>
                        <select id="mode-select">
                            <option value="auto">Tự động</option>
                            <option value="manual">Thủ công</option>
                        </select>
                    </div>
                    <div class="config-group" id="time-config-group">
                        <label for="time-input">Thời gian (giây):</label>
                        <input type="number" id="time-input" value="5" min="1" max="60">
                    </div>
                    <div class="config-group">
                        <label for="balloon-count">Số lượng bóng:</label>
                        <input type="number" id="balloon-count" value="10" min="1" max="100">
                    </div>
                </div>

                <button class="btn-main" id="start-btn">BẮT ĐẦU</button>
                <button class="btn-secondary" id="history-btn">🏆 THÀNH TÍCH</button>
            </div>

            <div id="ready-control">
                <div id="countdown-timer">60s</div>
                <button class="btn-main" id="ready-btn">BẮT ĐẦU GHI NHỚ ➔</button>
            </div>

            <div id="manual-controls">
                <button class="btn-main" id="manual-btn">NHẢY TIẾP ➔</button>
            </div>

            <div id="early-finish-controls">
                <button class="btn-main" id="early-finish-btn">⏹ KẾT THÚC BÀI</button>
            </div>
        </div>

        <!-- MÀN HÌNH CHẤM ĐIỂM -->
        <div id="recall-screen">
            <h2 class="recall-title">NHẬP LẠI DÃY SỐ THEO THỨ TỰ</h2>
            <div class="completion-time-tag" id="completion-time-display">⏱ --:-- --/--/---- | Người chơi: -- | Thời gian ghi nhớ: 0s</div>
            
            <div class="recall-grid" id="recall-grid"></div>
            <div id="recall-result"></div>
            
            <div style="display: flex; gap: 20px; margin-top: 10px;">
                <button class="btn-main" id="submit-btn">CHẤM ĐIỂM</button>
                <button class="btn-main" id="retry-btn" style="display: none; background: #27ae60;">CHƠI LẠI</button>
            </div>
        </div>

        <!-- MODAL XEM THÀNH TÍCH / LỊCH SỬ LUYỆN TẬP Ở TRANG ĐẦU -->
        <div id="history-modal">
            <div class="history-box">
                <div class="history-title">📜 LỊCH SỬ LUYỆN TẬP</div>
                <div class="history-table-container">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Thời gian</th>
                                <th>Tên người chơi</th>
                                <th>Chế độ</th>
                                <th>Điểm số</th>
                                <th>Thời gian ghi nhớ</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body">
                        </tbody>
                    </table>
                </div>
                <div style="text-align: center; margin-top: 15px;">
                    <button class="btn-main" id="close-history-btn" style="padding: 8px 30px; font-size: 16px;">ĐÓNG</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ASSET_PATHS = {
            bg: './background.png',
            ninjaIdle: './ninja-idle.png',
            ninjaHang: './ninja-hang.png',
            ninjaFinish: './ninja-finish.png',
            balloons: [
                './balloon-red.png',
                './balloon-blue.png',
                './balloon-yellow.png',
                './balloon-green.png'
            ]
        };

        const CONFIG = {
            world: { width: 1920, height: 1080 },
            ninja: { 
                width: 120, 
                height: 140, 
                handPoint: { x: 100, y: 35 } 
            },
            balloon: { 
                width: 180, 
                height: 320, 
                grabPoint: { x: 90, y: 295 }, 
                spacingX: 420, 
                startY: 180, 
                sinkDistance: 120 
            },
            timing: { hangDuration: 5000, transferDuration: 650, finishDuration: 900 },
            platforms: {
                pointA: { x: 150, y: 780, width: 300, height: 300 },
                pointB: { x: 4770, y: 780, width: 400, height: 300 }
            }
        };

        let GAME_SETTINGS = {
            playerName: 'Người chơi',
            mode: 'auto',
            hangTimeMs: 5000,
            balloonCount: 10
        };

        function getFormattedDateTime(d = new Date()) {
            const hrs = String(d.getHours()).padStart(2, '0');
            const mins = String(d.getMinutes()).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${hrs}:${mins} ${day}/${month}/${year}`;
        }

        class CodeSoundSynthesizer {
            constructor() {
                this.ctx = null;
                this.volume = 0.5;
                this.isMuted = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            setVolume(val) {
                this.volume = parseFloat(val);
            }

            setMute(muted) {
                this.isMuted = muted;
            }

            play(type) {
                if (!this.ctx || this.isMuted || this.volume <= 0) return;
                const ctx = this.ctx;
                const now = ctx.currentTime;
                const masterGain = this.volume;

                if (type === 'tick') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(400, now + 0.04);
                    gain.gain.setValueAtTime(0.2 * masterGain, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.04);

                } else if (type === 'urgent-tick') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);
                    gain.gain.setValueAtTime(0.25 * masterGain, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);

                } else if (type === 'jump') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.18);
                    gain.gain.setValueAtTime(0.3 * masterGain, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.18);

                } else if (type === 'grab') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(260, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.12);
                    gain.gain.setValueAtTime(0.4 * masterGain, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);

                } else if (type === 'land') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                    gain.gain.setValueAtTime(0.35 * masterGain, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);

                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        gain.gain.setValueAtTime(0.25 * masterGain, now + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.08);
                        osc.stop(now + idx * 0.08 + 0.3);
                    });
                }
            }
        }

        const soundSynth = new CodeSoundSynthesizer();

        class AssetLoader {
            constructor() {
                this.images = {};
            }

            async loadAll() {
                const loadImg = (src) => new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = src;
                });

                this.images.bg = await loadImg(ASSET_PATHS.bg);
                this.images.ninjaIdle = await loadImg(ASSET_PATHS.ninjaIdle);
                this.images.ninjaHang = await loadImg(ASSET_PATHS.ninjaHang);
                this.images.ninjaFinish = await loadImg(ASSET_PATHS.ninjaFinish);
                
                this.images.balloons = [];
                for (let bSrc of ASSET_PATHS.balloons) {
                    this.images.balloons.push(await loadImg(bSrc));
                }
            }
        }

        class Balloon {
            constructor(index, x, y, number, img) {
                this.index = index;
                this.baseX = x;
                this.baseY = y;
                this.x = x;
                this.y = y;
                this.number = number;
                this.img = img;
                this.swayOffset = Math.random() * Math.PI * 2;
                this.element = this._createElement();
            }

            _createElement() {
                const container = document.createElement('div');
                container.className = 'balloon-container';
                container.style.width = `${CONFIG.balloon.width}px`;
                container.style.height = `${CONFIG.balloon.height}px`;

                if (this.img) {
                    const imgEl = document.createElement('img');
                    imgEl.src = this.img.src;
                    imgEl.className = 'balloon-img';
                    container.appendChild(imgEl);
                } else {
                    const colors = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71'];
                    const fallback = document.createElement('div');
                    fallback.className = 'fallback-balloon';
                    fallback.style.backgroundColor = colors[this.index % colors.length];

                    const string = document.createElement('div');
                    string.className = 'fallback-string';
                    fallback.appendChild(string);
                    container.appendChild(fallback);
                }

                const numText = document.createElement('div');
                numText.className = 'balloon-number';
                numText.style.top = '28%';
                numText.style.fontSize = '32px';
                numText.innerText = this.number;
                container.appendChild(numText);

                return container;
            }

            update(time, isHanging, hangProgress) {
                const swayX = Math.sin(time * 0.0015 + this.swayOffset) * 4;
                const swayY = Math.cos(time * 0.002 + this.swayOffset) * 3;
                
                let sinkY = isHanging ? hangProgress * CONFIG.balloon.sinkDistance : 0;
                this.x = this.baseX + swayX;
                this.y = this.baseY + swayY + sinkY;
                this.element.style.transform = `translate3d(${this.x}px, ${this.y}px, 0)`;
            }

            getGrabWorldPoint() {
                return { x: this.x + CONFIG.balloon.grabPoint.x, y: this.y + CONFIG.balloon.grabPoint.y };
            }
        }

        class Ninja {
            constructor(assets) {
                this.assets = assets;
                this.x = 0;
                this.y = 0;
                this.rotation = 0;
                this.state = 'IDLE';
                this.element = this._createElement();
            }

            _createElement() {
                const container = document.createElement('div');
                container.className = 'ninja-container';
                container.style.width = `${CONFIG.ninja.width}px`;
                container.style.height = `${CONFIG.ninja.height}px`;

                this.imgEl = document.createElement('img');
                this.imgEl.className = 'ninja-img';

                this.fallbackEl = document.createElement('div');
                this.fallbackEl.className = 'fallback-ninja';
                this.fallbackEl.innerText = '🥷';
                this.fallbackEl.style.display = 'none';

                container.appendChild(this.imgEl);
                container.appendChild(this.fallbackEl);
                
                this.updateSprite('IDLE');
                return container;
            }

            updateSprite(state) {
                let img = null;
                if (state === 'IDLE' || state === 'WAITING') img = this.assets.ninjaIdle;
                else if (state === 'HANGING' || state === 'TRANSFERRING') img = this.assets.ninjaHang;
                else if (state === 'FINISHING' || state === 'FINISHED') img = this.assets.ninjaFinish;

                if (img) {
                    this.imgEl.src = img.src;
                    this.imgEl.style.display = 'block';
                    this.fallbackEl.style.display = 'none';
                } else {
                    this.imgEl.style.display = 'none';
                    this.fallbackEl.style.display = 'flex';
                }
            }

            setPositionByHand(handX, handY) {
                this.x = handX - CONFIG.ninja.handPoint.x;
                this.y = handY - CONFIG.ninja.handPoint.y;
            }

            updateTransforms() {
                this.element.style.transform = `translate3d(${this.x}px, ${this.y}px, 0) rotate(${this.rotation}deg)`;
            }
        }

        class Game {
            constructor() {
                this.container = document.getElementById('game-container');
                this.world = document.getElementById('game-world');
                this.stageLayer = document.getElementById('stage-layer');
                this.bgLayer = document.getElementById('background-layer');

                this.loader = new AssetLoader();
                this.cameraX = 0;
                this.balloons = [];
                this.generatedNumbers = [];
                this.currentBalloonIndex = -1;
                this.stateStartTime = 0;
                
                this.countdownInterval = null;
                this.countdownTime = 60;

                this.playStartTime = 0;
                this.playDurationSec = 0;
                this.finishTimeStamp = '';

                this.init();
            }

            async init() {
                this.handleResize();
                window.addEventListener('resize', () => this.handleResize());

                await this.loader.loadAll();

                if (this.loader.images.bg) {
                    this.bgLayer.style.backgroundImage = `url(${this.loader.images.bg.src})`;
                } else {
                    this.bgLayer.style.background = 'linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%)';
                }

                this.ninja = new Ninja(this.loader.images);
                this.stageLayer.appendChild(this.ninja.element);

                this.loadSavedPlayerName();
                this.setupUIEvents();
                this.setupAudioUI();
                this.resetToStart();

                requestAnimationFrame((t) => this.loop(t));
            }

            loadSavedPlayerName() {
                const savedName = localStorage.getItem('ninja_player_name');
                if (savedName) {
                    document.getElementById('player-name-input').value = savedName;
                }
            }

            handleResize() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                const targetRatio = 16 / 9;
                let containerWidth = (w / h > targetRatio) ? h * targetRatio : w;
                
                this.container.style.width = `${containerWidth}px`;
                this.container.style.height = `${containerWidth / targetRatio}px`;
                this.world.style.transform = `scale(${containerWidth / CONFIG.world.width})`;
            }

            setupAudioUI() {
                const muteBtn = document.getElementById('mute-btn');
                const volumeRange = document.getElementById('volume-range');

                muteBtn.addEventListener('click', () => {
                    soundSynth.init();
                    soundSynth.isMuted = !soundSynth.isMuted;
                    muteBtn.innerText = soundSynth.isMuted ? '🔇' : '🔊';
                });

                volumeRange.addEventListener('input', (e) => {
                    soundSynth.init();
                    soundSynth.setVolume(e.target.value);
                    if (parseFloat(e.target.value) === 0) {
                        muteBtn.innerText = '🔇';
                        soundSynth.isMuted = true;
                    } else {
                        muteBtn.innerText = '🔊';
                        soundSynth.isMuted = false;
                    }
                });
            }

            createPlatforms() {
                this.stageLayer.querySelectorAll('.platform').forEach(p => p.remove());

                CONFIG.platforms.pointB.x = CONFIG.platforms.pointA.x + 350 + (GAME_SETTINGS.balloonCount * CONFIG.balloon.spacingX) + 100;

                const createP = (p, label) => {
                    const el = document.createElement('div');
                    el.className = 'platform';
                    el.style.left = `${p.x}px`;
                    el.style.top = `${p.y}px`;
                    el.style.width = `${p.width}px`;
                    el.style.height = `${p.height}px`;
                    el.innerText = label;
                    this.stageLayer.appendChild(el);
                };
                createP(CONFIG.platforms.pointA, 'ĐIỂM A');
                createP(CONFIG.platforms.pointB, 'ĐÍCH B');

                this.bgLayer.style.width = `${CONFIG.platforms.pointB.x + 2000}px`;
            }

            spawnBalloons() {
                this.balloons.forEach(b => b.element.remove());
                this.balloons = [];
                this.generatedNumbers = [];

                for (let i = 0; i < GAME_SETTINGS.balloonCount; i++) {
                    const num = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
                    this.generatedNumbers.push(num);

                    const x = CONFIG.platforms.pointA.x + 350 + (i * CONFIG.balloon.spacingX);
                    const staggerY = (i % 2 === 0) ? -20 : 20;
                    const y = CONFIG.balloon.startY + staggerY;

                    const bImg = this.loader.images.balloons[i % this.loader.images.balloons.length];
                    const balloon = new Balloon(i, x, y, num, bImg);
                    
                    this.stageLayer.appendChild(balloon.element);
                    this.balloons.push(balloon);
                }
            }

            resetToStart() {
                if (this.countdownInterval) clearInterval(this.countdownInterval);

                this.readSettings();
                this.createPlatforms();
                this.spawnBalloons();
                this.currentBalloonIndex = -1;

                const startX = CONFIG.platforms.pointA.x + CONFIG.platforms.pointA.width / 2;
                const startY = CONFIG.platforms.pointA.y;

                this.ninja.state = 'IDLE';
                this.ninja.updateSprite('IDLE');
                this.ninja.setPositionByHand(startX, startY);
                this.ninja.rotation = 0;
                this.ninja.updateTransforms();

                this.cameraX = 0;
                this.updateCamera();

                this.world.classList.add('blurred');

                document.getElementById('start-overlay').style.display = 'flex';
                document.getElementById('ready-control').style.display = 'none';
                document.getElementById('recall-screen').style.display = 'none';
                document.getElementById('manual-controls').style.display = 'none';
                document.getElementById('early-finish-controls').style.display = 'none';
                document.getElementById('history-modal').style.display = 'none';
            }

            readSettings() {
                const nameVal = document.getElementById('player-name-input').value.trim() || 'Người chơi';
                const mode = document.getElementById('mode-select').value;
                const timeSec = parseFloat(document.getElementById('time-input').value) || 5;
                const count = parseInt(document.getElementById('balloon-count').value) || 10;

                GAME_SETTINGS.playerName = nameVal;
                GAME_SETTINGS.mode = mode;
                GAME_SETTINGS.hangTimeMs = timeSec * 1000;
                GAME_SETTINGS.balloonCount = count;

                localStorage.setItem('ninja_player_name', nameVal);
            }

            startJourney() {
                soundSynth.init();
                this.readSettings();
                this.createPlatforms();
                this.spawnBalloons();
                document.getElementById('start-overlay').style.display = 'none';
                
                this.ninja.state = 'WAITING';
                document.getElementById('ready-control').style.display = 'block';

                this.countdownTime = 60;
                const timerEl = document.getElementById('countdown-timer');
                timerEl.innerText = `${this.countdownTime}s`;

                if (this.countdownInterval) clearInterval(this.countdownInterval);
                this.countdownInterval = setInterval(() => {
                    this.countdownTime--;
                    timerEl.innerText = `${this.countdownTime}s`;
                    
                    if (this.countdownTime > 10) {
                        soundSynth.play('tick');
                    } else if (this.countdownTime > 0) {
                        soundSynth.play('urgent-tick');
                    }

                    if (this.countdownTime <= 0) {
                        clearInterval(this.countdownInterval);
                        this.triggerFirstJump();
                    }
                }, 1000);
            }

            triggerFirstJump() {
                if (this.countdownInterval) clearInterval(this.countdownInterval);

                this.world.classList.remove('blurred');
                document.getElementById('ready-control').style.display = 'none';
                
                document.getElementById('early-finish-controls').style.display = 'block';

                if (GAME_SETTINGS.mode === 'manual') {
                    document.getElementById('manual-controls').style.display = 'block';
                }

                this.playStartTime = performance.now();
                this.transitionToNext();
            }

            transitionToNext() {
                this.currentBalloonIndex++;
                soundSynth.play('jump');

                if (this.currentBalloonIndex < GAME_SETTINGS.balloonCount) {
                    const target = this.balloons[this.currentBalloonIndex];
                    this.transferStart = { x: this.ninja.x + CONFIG.ninja.handPoint.x, y: this.ninja.y + CONFIG.ninja.handPoint.y };
                    this.transferTarget = target.getGrabWorldPoint();
                    this.ninja.state = 'TRANSFERRING';
                    this.ninja.updateSprite('TRANSFERRING');
                    this.stateStartTime = performance.now();
                } else {
                    this.finishGameDirectly();
                }
            }

            finishGameDirectly() {
                this.playDurationSec = Math.round((performance.now() - this.playStartTime) / 1000);
                this.finishTimeStamp = getFormattedDateTime();

                document.getElementById('manual-controls').style.display = 'none';
                document.getElementById('early-finish-controls').style.display = 'none';

                this.ninja.state = 'FINISHED';
                this.ninja.updateSprite('FINISHED');
                soundSynth.play('land');
                this.showRecallScreen();
            }

            // Nhảy về quả bóng đầu tiên (Bóng số 1 - index 0) khi ấn phím Space ở chế độ thủ công
            jumpToFirstBalloon() {
                if (this.balloons.length === 0) return;
                this.currentBalloonIndex = 0;
                soundSynth.play('jump');
                const target = this.balloons[0];
                this.transferStart = { x: this.ninja.x + CONFIG.ninja.handPoint.x, y: this.ninja.y + CONFIG.ninja.handPoint.y };
                this.transferTarget = target.getGrabWorldPoint();
                this.ninja.state = 'TRANSFERRING';
                this.ninja.updateSprite('TRANSFERRING');
                this.stateStartTime = performance.now();
            }

            loop(now) {
                const elapsed = now - this.stateStartTime;

                this.balloons.forEach((b, idx) => {
                    const isHanging = (this.ninja.state === 'HANGING' && idx === this.currentBalloonIndex);
                    const progress = isHanging ? Math.min(elapsed / GAME_SETTINGS.hangTimeMs, 1) : 0;
                    b.update(now, isHanging, progress);
                });

                if (this.ninja.state === 'HANGING') {
                    const grab = this.balloons[this.currentBalloonIndex].getGrabWorldPoint();
                    this.ninja.setPositionByHand(grab.x, grab.y);
                    this.ninja.rotation = Math.sin(now * 0.003) * 3;

                    if (GAME_SETTINGS.mode === 'auto' && elapsed >= GAME_SETTINGS.hangTimeMs) {
                        this.transitionToNext();
                    }
                } else if (this.ninja.state === 'TRANSFERRING' || this.ninja.state === 'FINISHING') {
                    const duration = (this.ninja.state === 'TRANSFERRING') ? CONFIG.timing.transferDuration : CONFIG.timing.finishDuration;
                    const t = Math.min(elapsed / duration, 1);
                    const easeT = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

                    const currX = this.transferStart.x + (this.transferTarget.x - this.transferStart.x) * easeT;
                    const straightY = this.transferStart.y + (this.transferTarget.y - this.transferStart.y) * easeT;
                    const currY = straightY + (-Math.sin(t * Math.PI) * 80);

                    this.ninja.setPositionByHand(currX, currY);
                    this.ninja.rotation = Math.sin(t * Math.PI) * 15;

                    if (t >= 1) {
                        if (this.ninja.state === 'TRANSFERRING') {
                            this.ninja.state = 'HANGING';
                            this.ninja.updateSprite('HANGING');
                            this.ninja.rotation = 0;
                            this.stateStartTime = now;
                            soundSynth.play('grab');
                        }
                    }
                }

                this.ninja.updateTransforms();
                this.updateCamera();

                requestAnimationFrame((t) => this.loop(t));
            }

            updateCamera() {
                const ninjaHandX = this.ninja.x + CONFIG.ninja.handPoint.x;
                const targetCamX = Math.max(0, ninjaHandX - (CONFIG.world.width * 0.3));
                this.cameraX += (targetCamX - this.cameraX) * 0.1;
                this.stageLayer.style.transform = `translate3d(${-this.cameraX}px, 0, 0)`;
                this.bgLayer.style.transform = `translate3d(${-this.cameraX * 0.4}px, 0, 0)`;
            }

            setupUIEvents() {
                document.getElementById('mode-select').addEventListener('change', (e) => {
                    const isAuto = e.target.value === 'auto';
                    document.getElementById('time-config-group').style.display = isAuto ? 'flex' : 'none';
                });

                document.getElementById('start-btn').addEventListener('click', () => this.startJourney());
                document.getElementById('ready-btn').addEventListener('click', () => this.triggerFirstJump());

                document.getElementById('history-btn').addEventListener('click', () => {
                    this.renderHistoryTable();
                    document.getElementById('history-modal').style.display = 'flex';
                });

                document.getElementById('close-history-btn').addEventListener('click', () => {
                    document.getElementById('history-modal').style.display = 'none';
                });

                document.getElementById('manual-btn').addEventListener('click', () => {
                    if (this.ninja.state === 'HANGING') {
                        this.transitionToNext();
                    }
                });

                document.getElementById('early-finish-btn').addEventListener('click', () => {
                    if (this.ninja.state === 'HANGING' || this.ninja.state === 'TRANSFERRING') {
                        this.finishGameDirectly();
                    }
                });

                window.addEventListener('keydown', (e) => {
                    if (this.ninja.state === 'WAITING') {
                        if (e.code === 'Space' || e.code === 'ArrowRight') {
                            this.triggerFirstJump();
                        }
                    } else if (this.ninja.state === 'HANGING' && GAME_SETTINGS.mode === 'manual') {
                        if (e.code === 'ArrowRight') {
                            this.transitionToNext();
                        } else if (e.code === 'Space') {
                            // Phím Cách (Space) khiến người chơi bay về quả bóng đầu tiên để ôn tập
                            this.jumpToFirstBalloon();
                        }
                    }
                });

                document.getElementById('submit-btn').addEventListener('click', () => this.evaluateRecall());
                document.getElementById('retry-btn').addEventListener('click', () => this.resetToStart());
            }

            showRecallScreen() {
                const screen = document.getElementById('recall-screen');
                const grid = document.getElementById('recall-grid');
                grid.innerHTML = '';
                document.getElementById('recall-result').innerText = '';
                document.getElementById('submit-btn').style.display = 'inline-block';
                document.getElementById('retry-btn').style.display = 'none';

                // Màn hình chấm điểm: Giờ:Phút Ngày/Tháng/Năm + Tên + Thời gian ghi nhớ
                const timeInfo = `⏱ ${this.finishTimeStamp} | Người chơi: ${GAME_SETTINGS.playerName} | Thời gian ghi nhớ: ${this.playDurationSec}s`;
                document.getElementById('completion-time-display').innerText = timeInfo;

                for (let i = 0; i < GAME_SETTINGS.balloonCount; i++) {
                    const item = document.createElement('div');
                    item.className = 'recall-item';
                    item.innerHTML = `
                        <label>Bóng ${i + 1}</label>
                        <input type="text" maxlength="4" class="recall-input" data-index="${i}">
                        <div class="correct-answer-label" id="correct-${i}"></div>
                    `;
                    grid.appendChild(item);
                }

                grid.querySelectorAll('.recall-input').forEach(input => {
                    input.addEventListener('input', (e) => {
                        e.target.value = e.target.value.replace(/[^0-9]/g, '');
                        if (e.target.value.length === 4) {
                            const nextIdx = parseInt(e.target.dataset.index) + 1;
                            const next = grid.querySelector(`.recall-input[data-index="${nextIdx}"]`);
                            if (next) next.focus();
                        }
                    });
                });

                screen.style.display = 'flex';
            }

            evaluateRecall() {
                soundSynth.play('win');
                let correctCount = 0;
                for (let i = 0; i < GAME_SETTINGS.balloonCount; i++) {
                    const inputs = document.querySelectorAll('.recall-input');
                    const input = inputs[i];
                    if (!input) continue;

                    const item = input.parentElement;
                    const correctLabel = document.getElementById(`correct-${i}`);

                    const userVal = input.value.trim().padStart(4, '0');
                    const targetVal = this.generatedNumbers[i];
                    input.disabled = true;

                    if (userVal === targetVal && input.value.trim() !== '') {
                        correctCount++;
                        item.classList.add('correct');
                    } else {
                        item.classList.add('wrong');
                        correctLabel.innerText = `Đúng: ${targetVal}`;
                        correctLabel.style.display = 'block';
                    }
                }

                const scoreStr = `${correctCount}/${GAME_SETTINGS.balloonCount}`;
                document.getElementById('recall-result').innerText = `Kết quả: ${scoreStr} dãy số!`;
                document.getElementById('submit-btn').style.display = 'none';
                document.getElementById('retry-btn').style.display = 'inline-block';

                this.saveHistory(scoreStr);
            }

            saveHistory(scoreStr) {
                const history = JSON.parse(localStorage.getItem('ninja_history') || '[]');
                const newRecord = {
                    datetime: this.finishTimeStamp || getFormattedDateTime(),
                    name: GAME_SETTINGS.playerName,
                    mode: GAME_SETTINGS.mode === 'auto' ? 'Tự động' : 'Thủ công',
                    score: scoreStr,
                    time: `${this.playDurationSec}s`
                };
                history.unshift(newRecord);
                if (history.length > 20) history.pop();
                localStorage.setItem('ninja_history', JSON.stringify(history));
            }

            renderHistoryTable() {
                const history = JSON.parse(localStorage.getItem('ninja_history') || '[]');
                const tbody = document.getElementById('history-table-body');
                tbody.innerHTML = '';

                if (history.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="color: #64748b; padding: 20px;">Chưa có lịch sử luyện tập</td></tr>';
                    return;
                }

                history.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="color: #94a3b8; font-size: 13px;">${item.datetime || 'N/A'}</td>
                        <td>${item.name}</td>
                        <td>${item.mode}</td>
                        <td style="color: #f1c40f; font-weight: bold;">${item.score}</td>
                        <td>${item.time}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => new Game());
        } else {
            new Game();
        }
    </script>
